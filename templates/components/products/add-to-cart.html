<div class="bis-purchase-container">
    <div class="bis-purchase-controls">
        {{#if theme_settings.show_product_quantity_box}}
            <div class="form-field form-field--increments bis-qty-wrapper">
                <label class="form-label is-srOnly" for="qty[]">{{lang 'products.quantity'}}</label>
                <div class="form-increment bis-qty-stepper" data-quantity-change>
                    <button class="button button--icon bis-qty-btn bis-qty-btn--dec" data-action="dec" type="button" aria-label="{{lang 'products.quantity_decrease'}}">
                        <span class="is-srOnly">{{lang 'products.quantity_decrease'}}</span>
                        <span aria-hidden="true" class="bis-qty-symbol">&minus;</span>
                    </button>
                    <input class="form-input form-input--incrementTotal bis-qty-input"
                           id="qty[]"
                           name="qty[]"
                           type="tel"
                           value="{{#if product.min_purchase_quantity}}{{product.min_purchase_quantity}}{{else}}1{{/if}}"
                           data-quantity-min="{{product.min_purchase_quantity}}"
                           data-quantity-max="{{product.max_purchase_quantity}}"
                           min="1"
                           pattern="[0-9]*"
                           aria-live="polite">
                    <button class="button button--icon bis-qty-btn bis-qty-btn--inc" data-action="inc" type="button" aria-label="{{lang 'products.quantity_increase'}}">
                        <span class="is-srOnly">{{lang 'products.quantity_increase'}}</span>
                        <span aria-hidden="true" class="bis-qty-symbol">&plus;</span>
                    </button>
                </div>
            </div>
        {{/if}}

        {{#or customer (if theme_settings.restrict_to_login '!==' true)}}
            <div class="form-action bis-add-cart-action">
                <button id="form-action-addToCart" data-wait-message="{{lang 'products.adding_to_cart'}}" class="button button--primary bis-btn-add-cart" type="submit">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="bis-cart-icon"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span>{{#if product.pre_order}}{{lang 'products.pre_order'}}{{else}}{{lang 'products.add_to_cart'}}{{/if}}</span>
                </button>
            </div>
        {{/or}}
    </div>

    <div class="alertBox productAttributes-message" style="display:none">
        <div class="alertBox-column alertBox-icon">
            <icon glyph="ic-success" class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"></path></svg></icon>
        </div>
        <p class="alertBox-column alertBox-message"></p>
    </div>
</div>
