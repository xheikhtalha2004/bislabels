<div class="form-field bis-option-group" data-product-attribute="swatch">
    <label class="form-label form-label--alternate bis-option-label">
        <span class="bis-option-title">Choose {{this.display_name}}</span>
        <span data-option-value class="bis-selected-val"></span>
        {{#if required}}
            <small class="bis-required-tag">{{lang 'common.required'}}</small>
        {{/if}}
    </label>

    <div class="bis-swatch-grid">
        {{#each this.values}}
            <input class="form-radio bis-swatch-radio" type="radio" name="attribute[{{../id}}]" value="{{id}}" id="attribute_swatch_{{../id}}_{{id}}" {{#if selected}}checked data-default{{/if}} {{#if ../required}}required{{/if}}>
            <label class="form-option form-option-swatch bis-swatch-card" for="attribute_swatch_{{../id}}_{{id}}" data-product-attribute-value="{{id}}">
                {{#if image}}
                    <span class='form-option-variant form-option-variant--pattern bis-swatch-pattern' title="{{this.label}}" style="background-image: url('{{getImage image "swatch_option_size"}}');"></span>
                {{/if}}
                {{#if data.[2]}}
                    <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[0]}}"></span>
                    <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[1]}}"></span>
                    <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[2]}}"></span>
                {{else}}
                    {{#if data.[1]}}
                        <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[0]}}"></span>
                        <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[1]}}"></span>
                    {{else}}
                        {{#if data.[0]}}
                            <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[0]}}"></span>
                        {{/if}}
                    {{/if}}
                {{/if}}
                {{#if pattern}}
                    <span class="form-option-expanded">
                        <span class="form-option-image" style="background-image: url('{{getImage image 'core-swatch'}}');"></span>
                    </span>
                {{/if}}
            </label>
        {{/each}}
    </div>
</div>
