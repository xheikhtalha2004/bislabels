<div class="form-field bis-option-group" data-product-attribute="set-select">
    <label class="form-label form-label--alternate bis-option-label" for="attribute_select_{{id}}">
        <span class="bis-option-title">Choose {{ this.display_name }}</span>
        {{#if required}}
            <small class="bis-required-tag">{{lang 'common.required'}}</small>
        {{/if}}
    </label>

    <div class="bis-select-box bis-searchable-select" data-searchable-select>
        {{!-- Hidden native select — BC JS reads this for value/variant state --}}
        <select class="form-select bis-select-input bis-select-native"
                name="attribute[{{this.id}}]"
                id="attribute_select_{{id}}"
                {{#if required}}required{{/if}}
                aria-label="Choose {{this.display_name}}">
            <option value="">Select {{this.display_name}}...</option>
            {{#each this.values}}
                <option data-product-attribute-value="{{id}}" value="{{id}}" {{#if selected}}selected data-default{{/if}}>{{label}}</option>
            {{/each}}
        </select>

        {{!-- Custom searchable UI overlay — driven by JS in bis-pdp-options.js --}}
        <div class="bis-custom-select" aria-hidden="true">
            <div class="bis-custom-select-trigger" tabindex="-1">
                <span class="bis-custom-select-value">Select {{this.display_name}}...</span>
                <svg class="bis-select-chevron-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="bis-custom-select-dropdown">
                <div class="bis-custom-select-search-wrap">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text"
                           class="bis-custom-select-search"
                           placeholder="Search..."
                           autocomplete="off"
                           aria-label="Search {{this.display_name}}">
                </div>
                <ul class="bis-custom-select-list" role="listbox">
                    {{#each this.values}}
                    <li class="bis-custom-select-item{{#if selected}} is-selected{{/if}}"
                        role="option"
                        data-value="{{id}}"
                        data-label="{{label}}"
                        {{#if selected}}aria-selected="true"{{/if}}>
                        {{label}}
                    </li>
                    {{/each}}
                </ul>
                <p class="bis-custom-select-empty" style="display:none;">No options found</p>
            </div>
        </div>
    </div>
</div>
