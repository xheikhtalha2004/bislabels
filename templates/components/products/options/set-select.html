<div class="form-field bis-option-group" data-product-attribute="set-select">
    <label class="form-label form-label--alternate bis-option-label" for="attribute_select_{{id}}">
        <span class="bis-option-title">Choose {{ this.display_name }}</span>
        {{#if required}}
            <small class="bis-required-tag">{{lang 'common.required'}}</small>
        {{/if}}
    </label>

    <div class="bis-select-box">
        <select class="form-select bis-select-input" name="attribute[{{this.id}}]" id="attribute_select_{{id}}" {{#if required}}required{{/if}}>
            <option value="">Search or select {{this.display_name}}...</option>
            {{#each this.values}}
                <option data-product-attribute-value="{{id}}" value="{{id}}" {{#if selected}}selected data-default{{/if}}>{{label}}</option>
            {{/each}}
        </select>
        <div class="bis-select-chevron" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
    </div>
</div>
