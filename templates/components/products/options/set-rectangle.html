<div class="form-field bis-option-group" data-product-attribute="set-rectangle">
    <label class="form-label form-label--alternate bis-option-label">
        <span class="bis-option-title">Choose {{this.display_name}}</span>
        <span data-option-value class="bis-selected-val"></span>
        {{#if required}}
            <small class="bis-required-tag">{{lang 'common.required'}}</small>
        {{/if}}
    </label>
    <div class="bis-rectangle-grid">
        {{#each this.values}}
            <input
                class="form-radio bis-rectangle-radio"
                type="radio"
                id="attribute_rectangle__{{../id}}_{{id}}"
                name="attribute[{{../id}}]"
                value="{{id}}"
                {{#if selected}}
                    checked
                    data-default
                {{/if}}
                {{#if ../required}}required{{/if}}>
            <label class="form-option bis-rectangle-card" for="attribute_rectangle__{{../id}}_{{id}}" data-product-attribute-value="{{id}}">
                <span class="form-option-variant bis-rectangle-text">{{this.label}}</span>
                <span class="bis-rectangle-check" aria-hidden="true">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </span>
            </label>
        {{/each}}
    </div>
</div>
